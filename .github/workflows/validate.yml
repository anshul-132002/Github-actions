name: validate file 
on: workflow_dispatch
jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate file
        run: node script.js

      - name: validate html file 
        run: test -f index.html

  validate-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: validate js file 
        run: test -f script.js

  validate-code:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
          name: get repo file 
        
        - uses: node --check script.js
          name: validate js code 
        
        - uses: node --check index.html
          name: validate html code 